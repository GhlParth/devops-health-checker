# Create this secret with:
#
#   kubectl create secret generic devops-health-checker \
#     --from-literal=api-token="$(python -c 'import secrets; print(secrets.token_hex(32))')" \
#     --from-literal=openrouter-api-key="sk-or-v1-..." \
#     --from-literal=github-token="ghp_..."
#
# Or with Helm / ExternalSecrets / Vault Agent — DO NOT store real values here.
#
apiVersion: v1
kind: Secret
metadata:
  name: devops-health-checker
type: Opaque
stringData:
  api-token: "REPLACE_ME"
  openrouter-api-key: "REPLACE_ME"
  github-token: "REPLACE_ME"
