apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-health-checker
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Rate limit at the ingress layer (complement to app-level slowapi)
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - devops-health-checker.your-domain.com
      secretName: devops-health-checker-tls
  rules:
    - host: devops-health-checker.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-health-checker
                port:
                  name: http
