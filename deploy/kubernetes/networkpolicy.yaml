apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devops-health-checker
spec:
  podSelector:
    matchLabels:
      app: devops-health-checker
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from ingress controller only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Allow Prometheus scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS to external APIs (GitHub, AWS, OpenRouter)
    - ports:
        - protocol: TCP
          port: 443
    # Allow HTTP (needed for some internal endpoints)
    - ports:
        - protocol: TCP
          port: 80
