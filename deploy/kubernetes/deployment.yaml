apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-health-checker
  labels:
    app: devops-health-checker
    version: "0.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: devops-health-checker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # zero downtime rollouts
  template:
    metadata:
      labels:
        app: devops-health-checker
        version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      # Don't co-locate both replicas on the same node
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: devops-health-checker

      terminationGracePeriodSeconds: 30

      containers:
        - name: api
          image: devops-health-checker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080

          env:
            - name: DEVOPS_API_HOST
              value: "0.0.0.0"
            - name: DEVOPS_API_PORT
              value: "8080"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DEVOPS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-health-checker
                  key: api-token
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-health-checker
                  key: openrouter-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-health-checker
                  key: github-token

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
