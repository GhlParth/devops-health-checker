[project]
name = "devops-health-checker"
version = "0.1.0"
description = "A Python-based infrastructure health checker for AWS, Kubernetes, and GitHub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "kubernetes>=36.0.3",
    "prometheus-client>=0.21.0",
    "python-dotenv",
    "python-json-logger>=2.0.7",
    "pyyaml",
    "requests",
    "slowapi>=0.1.9",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
devops-health-checker = "devops_health_checker.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.7.10",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-pyyaml",
    "types-requests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (standard in FastAPI Depends)
    "B905",  # zip without strict=
    "UP042", # StrEnum backwards compatibility
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B104", "B105", "B106", "B108"]
